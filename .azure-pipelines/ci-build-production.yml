name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - '*'

pr: none

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows

    stages:
      - stage: Build
        displayName: Build and test SDK
        jobs:
          - job: Test
            displayName: Test supported Node.js versions
            strategy:
              matrix:
                Node22:
                  NODE_VERSION: '22.x'
                Node24:
                  NODE_VERSION: '24.x'
                Node26:
                  NODE_VERSION: '26.x'
              maxParallel: 2
            steps:
              - checkout: self
              - task: UseNode@1
                inputs:
                  version: $(NODE_VERSION)
                displayName: Install Node.js

              - script: npm ci
                displayName: Install test dependencies
              - script: npm run build
                displayName: Build SDK for tests
              - script: npm test
                displayName: Run Node.js and browser tests

              - task: PublishTestResults@2
                displayName: Publish unit test results
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: '**/testResult.xml'
                  testRunTitle: Node.js $(NODE_VERSION)
                  failTaskOnFailedTests: true

          - job: BuildPackage
            displayName: Build production artifact
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish packed SDK for validation
                  artifactName: sdk-build
                  targetPath: $(Build.ArtifactStagingDirectory)
            steps:
              - checkout: self
              - task: UseNode@1
                inputs:
                  version: '22.x'
                displayName: Install Node.js

              - script: |
                  node -e "
                    const version = require('./package.json').version;
                    const branch = process.env.BUILD_SOURCEBRANCH;
                    if (branch.startsWith('refs/tags/')) {
                      const tag = branch.slice('refs/tags/'.length);
                      if (tag !== version) {
                        throw new Error('Release tag ' + tag + ' must match package version ' + version);
                      }
                    }
                  "
                displayName: Validate release tag matches package version
              - script: npm ci
                displayName: Install production build dependencies
              - script: npm run build
                displayName: Build production SDK
              - script: npm pack --ignore-scripts --pack-destination "$(Build.ArtifactStagingDirectory)"
                displayName: Pack built SDK without rerunning prepack

      - stage: Publish
        displayName: Publish SDK to npm via ESRP
        dependsOn: Build
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'))
        jobs:
          - deployment: PublishNpm
            displayName: Publish validated SDK via ESRP Release
            environment: msgraph-npm-org
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: sdk-build
                  targetPath: $(Build.ArtifactStagingDirectory)/npm
              outputs:
                - output: pipelineArtifact
                  displayName: Publish release-drop
                  artifactName: release-drop
                  targetPath: $(Build.ArtifactStagingDirectory)/npm
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: none
                    - download: none
                    - task: EsrpRelease@9
                      displayName: Publish npm package via ESRP Release
                      inputs:
                        connectedservicename: Federated DevX ESRP Managed Identity Connection
                        usemanagedidentity: false
                        keyvaultname: akv-prod-eastus
                        authcertname: ReferenceLibraryPrivateCert
                        signcertname: ReferencePackagePublisherCertificate
                        clientid: 65035b7f-7357-4f29-bf25-c5ee5c3949f8
                        intent: PackageDistribution
                        contenttype: npm
                        contentsource: Folder
                        folderlocation: $(Build.ArtifactStagingDirectory)/npm
                        owners: christiano@microsoft.com,ramsess@microsoft.com,gavinbarron@microsoft.com,jingjingjia@microsoft.com,peombwa@microsoft.com,treicys@microsoft.com
                        approvers: christiano@microsoft.com,ramsess@microsoft.com,gavinbarron@microsoft.com,jingjingjia@microsoft.com,peombwa@microsoft.com,treicys@microsoft.com
                        serviceendpointurl: https://api.esrp.microsoft.com
                        mainpublisher: ESRPRELPACMAN
                        domaintenantid: cdc5aeea-15c5-4db6-b079-fcadd2505dc2
