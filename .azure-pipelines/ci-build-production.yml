name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
  - name: publishReleaseArtifact
    displayName: Publish release-drop for the external release pipeline (manual main runs only)
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows

    stages:
      - stage: Build
        displayName: Build and test SDK
        jobs:
          - job: Test
            displayName: Test supported Node.js versions
            strategy:
              matrix:
                Node22:
                  NODE_VERSION: '22.x'
                Node24:
                  NODE_VERSION: '24.x'
                Node26:
                  NODE_VERSION: '26.x'
              maxParallel: 2
            steps:
              - checkout: self
              - task: UseNode@1
                inputs:
                  version: $(NODE_VERSION)
                displayName: Install Node.js

              - script: npm ci
                displayName: Install test dependencies
              - script: npm run build
                displayName: Build SDK for tests
              - script: npm test
                displayName: Run Node.js and browser tests

              - task: PublishTestResults@2
                displayName: Publish unit test results
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: '**/testResult.xml'
                  testRunTitle: Node.js $(NODE_VERSION)
                  failTaskOnFailedTests: true

          - job: BuildPackage
            displayName: Build production artifact
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish SDK build for validation
                  artifactName: sdk-build
                  targetPath: $(Build.ArtifactStagingDirectory)
            steps:
              - checkout: self
              - task: UseNode@1
                inputs:
                  version: '22.x'
                displayName: Install Node.js

              - script: npm ci
                displayName: Install production build dependencies
              - script: npm run build
                displayName: Build production SDK
              - task: CopyFiles@2
                inputs:
                  sourceFolder: $(Build.SourcesDirectory)
                  targetFolder: $(Build.ArtifactStagingDirectory)
                  Contents: |
                    **/*
                    !.azure-pipelines/**
                    !.github/**
                    !.git/**
                    !.vscode/**
                displayName: Stage npm package

      - stage: Publish
        displayName: Publish release artifact
        dependsOn: Build
        condition: and(succeeded(), ${{ eq(parameters.publishReleaseArtifact, true) }}, eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        jobs:
          - job: PublishReleaseArtifact
            displayName: Publish validated SDK for external release
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            templateContext:
              inputs:
                - input: pipelineArtifact
                  artifactName: sdk-build
                  targetPath: $(Build.ArtifactStagingDirectory)
              outputs:
                - output: pipelineArtifact
                  displayName: Publish release-drop
                  artifactName: release-drop
                  targetPath: $(Build.ArtifactStagingDirectory)
            steps:
              - checkout: none
